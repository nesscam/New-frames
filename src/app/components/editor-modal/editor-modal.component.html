<ion-content [fullscreen]="true" class="editor-content">

  <!-- Background radial gradient (igual que auth-modal) -->
  <div class="editor-bg-gradient"></div>

  <!-- Canvas flotante sobre el fondo -->
  <div class="editor-container">
    <div class="canvas-wrapper"
         [class.has-styled]="styledImage !== null"
         [attr.data-frame]="selectedFrameId"
         [attr.data-style]="isApplyingStyle ? 'loading' : 'done'">
      <canvas #fabricCanvas></canvas>
      <div *ngIf="isApplyingStyle" class="spinner-overlay">
        <ion-spinner name="crescent" color="light"></ion-spinner>
        <p>{{ 'EDITOR.APPLYING' | translate }}</p>
      </div>
    </div>
  </div>

  <!-- Panel de controles (estilo auth-container) -->
  <div class="editor-panel-container">

    <!-- UPLOAD STEP -->
    <div *ngIf="currentStep === 'upload'" class="step-panel upload-panel">
      <h2>{{ 'EDITOR.UPLOAD_TITLE' | translate }}</h2>
      <p>{{ 'EDITOR.UPLOAD_DESC' | translate }}</p>
      <input type="file" id="file-upload" (change)="onFileSelected($event)" accept="image/*" hidden />
      <label for="file-upload" class="primary-btn">
        {{ 'HOME.UPLOAD_PHOTO' | translate }}
      </label>
    </div>

    <!-- STYLE STEP -->
    <div *ngIf="currentStep === 'style'" class="step-panel style-panel">
      <h2>{{ 'EDITOR.CHOOSE_STYLE' | translate }}</h2>
      <div class="horiz-scroll">
        <button class="chip-btn" *ngFor="let style of styles"
                [class.selected]="preselectedStyle === style"
                (click)="applyStyle(style)">
          {{ 'STYLES.' + style.toUpperCase() | translate }}
        </button>
      </div>
    </div>

    <!-- FRAME STEP -->
    <div *ngIf="currentStep === 'frame'" class="step-panel frame-panel">
      <h2>{{ 'EDITOR.CHOOSE_FRAME' | translate }}</h2>
      <div class="horiz-scroll">
        <button class="chip-btn"
                *ngFor="let frame of frames"
                [class.selected]="selectedFrameId === frame.id"
                (click)="selectFrame(frame.id)">
          {{ frame.material }}<br><small>{{ frame.price | currency:frame.currency }}</small>
        </button>
      </div>
    </div>

    <!-- Footer nav -->
    <div class="footer-nav">
      <ion-button fill="clear" color="light" (click)="prevStep()" [disabled]="currentStep === 'upload'">
        {{ 'EDITOR.BACK' | translate }}
      </ion-button>
      <div class="step-indicator">{{ currentStep | uppercase }}</div>
      <button class="next-btn" (click)="nextStep()" [disabled]="!originalImage || currentStep === 'checkout'">
        {{ 'EDITOR.NEXT' | translate }}
      </button>
    </div>

  </div>

</ion-content>
