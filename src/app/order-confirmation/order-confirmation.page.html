<ion-content [fullscreen]="true" class="confirmation-content">

  <!-- Background radial gradient -->
  <div class="confirmation-bg-gradient"></div>

  <div class="confirmation-container">

    <!-- Icono de éxito -->
    <div class="success-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
    </div>

    <h1>{{ 'CONFIRMATION.THANK_YOU' | translate }}</h1>
    <p>{{ 'CONFIRMATION.DESC' | translate }}</p>

    <!-- Número de pedido -->
    <div class="order-number-box" *ngIf="orderId">
      <small>{{ 'CONFIRMATION.ORDER_NUMBER' | translate }}</small>
      <strong>{{ orderId }}</strong>
    </div>

    <!-- Botón volver -->
    <button class="home-btn" (click)="goHome()">
      {{ 'CONFIRMATION.GO_HOME' | translate }}
    </button>

  </div>

</ion-content>
